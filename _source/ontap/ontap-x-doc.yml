root_overview:
  ai-gen:
    keywords: ontap rest api, storage management, svm tunneling, hal linking, record
      filtering, asynchronous operations
    lead: Explore the ONTAP REST API to understand its extensive capabilities for
      managing your storage infrastructure. This overview introduces the various types
      of API calls available, providing crucial details on how to effectively utilize
      each endpoint for automation and system management tasks.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud storage,object storage,storage management,cloud targets,ontap
      cloud
    lead: Manage cloud object storage targets to optimize data storage and retrieval
      in your environment.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,add nodes,cluster configuration,node discovery,update
      software,view jobs
    lead: Manage cluster creation, configuration, and node discovery workflows with
      these endpoints. Use them to add nodes, update software, and monitor job progress
      in your ONTAP environment. Pre-cluster APIs also support initial setup and tracking
      before the cluster is fully established.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: networking information, ipspaces, broadcast domains, ethernet ports,
      fibre channel interfaces, service policies
    lead: Explore networking endpoints to report and manage networking configurations
      such as IPspaces, Ethernet and Fibre Channel interfaces, routes, ports, and
      service policies. These endpoints help you configure and secure network access
      and traffic within your ONTAP cluster.
- id: svm
  title: ONTAP REST API svm endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine, data access, network services, protocol configuration,
      export policies, name mappings
    lead: Manage Storage Virtual Machines (SVMs) and their attributes using SVM endpoints
      to configure protocols, policies, and network services. These endpoints help
      you securely isolate data storage and network, providing independent management
      for each SVM in your cluster.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,dns resolution,nis configuration,ldap setup,network information
    lead: Utilize name-services endpoints to manage user authentication and credential
      mapping in mixed environments. Configure NIS, LDAP, and DNS services to ensure
      proper resolution and information retrieval for ONTAP systems.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: san management,fibre channel,iscsi sessions,initiator groups,lun mapping
    lead: Configure, provision, and manage storage area network (SAN) objects using
      the SAN endpoints. These endpoints help you establish and maintain robust SAN
      environments and optimize storage operations.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme configuration,nvme management,fibre channel logins,nvme subsystems,nvme
      namespaces,nvme interfaces
    lead: Configure, provision, and manage NVMe-related objects using these endpoints.
      Utilize them to support NVMe commands over fabric interconnects and enable simultaneous
      host connections. This category covers various NVMe-specific information, including
      interfaces, services, subsystem controllers, maps, subsystems, and namespaces.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: storage management, application templates, protocol access, virtualization
      applications, crash consistent
    lead: ONTAP application endpoints streamline storage management with application-specific
      terminology, enabling you to provision and oversee storage objects tailored
      to your applications. These APIs facilitate efficient storage provisioning with
      parameters that follow NetApp best practices, allowing you to manage ONTAP objects
      collectively as applications. The library includes templates for various applications,
      such as databases and virtualization platforms.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,autosupport settings,event handling,cluster settings,node
      settings,external server
    lead: Use ONTAP support APIs to manage configuration backups, autosupport settings,
      and event handling. Configuration backups ensure protection against corruption
      by saving copies of node and cluster settings.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: security settings,cluster security,svm security,saml configuration,identity
      provider,multi-factor authentication
    lead: Secure your ONTAP cluster by managing security settings with security endpoints.
      Use these APIs to configure SAML authentication, integrating ONTAP with third-party
      identity providers for enhanced multi-factor authentication.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: ontap storage,physical storage,logical storage,aggregates management,volume
